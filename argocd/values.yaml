app:
  name: blue-green-app
  image: nginx:1.21
  replicas: 3

deployment:
  setProductionState: true

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"

services:
  active: blue-green-active
  preview: blue-green-preview
  port: 80

rollout:
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30